name: Supabase Keepalive

# Supabase pauses free-tier projects after 7 days with no activity.
# This job pokes the REST API on a schedule so the project stays awake
# even if nobody signs into the console for a week.
#
# The URL and anon key below are already public (they ship in the client
# bundle, see src/App.jsx), so they are hardcoded here on purpose.

on:
  schedule:
    # Runs on days 1, 6, 11, 16, 21, 26, 31 of every month at 06:00 UTC.
    # Largest gap between runs is ~6 days (day 26 -> 31 -> 1), safely under
    # Supabase's 7-day inactivity window.
    - cron: "0 6 */5 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

env:
  SUPABASE_URL: "https://znagrcavnkfigseqqgfz.supabase.co"
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYWdyY2F2bmtmaWdzZXFxZ2Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MjIzOTUsImV4cCI6MjA5OTQ5ODM5NX0.5JwhEkW_wRFhbXw_feH43g_-s_xW4b_jXkn9z8-ZzxM"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/kv_store?select=key&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          # 2xx = healthy. Anything else fails the run so we get notified.
          case "$code" in
            2*) echo "Supabase is awake." ;;
            *)  echo "Unexpected response from Supabase."; exit 1 ;;
          esac
